name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write

env:
  OWNER_NAME: askay35
  REPO_NAME: ayakun-ai-workflow
  FRONTEND_IMAGE: ghcr.io/askay35/ayakun-ai-workflow-frontend
  BACKEND_IMAGE: ghcr.io/askay35/ayakun-ai-workflow-backend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            deploy_config:
              - 'docker-compose*.yml'
              - 'migrate.sh'
              - '.github/workflows/deploy.yml'

  build-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.deploy_config == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.deploy_config == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/app/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-frontend
      - build-backend
    if: |
      always()
      && needs.changes.result == 'success'
      && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
      && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
      && (
        needs.build-frontend.result == 'success'
        || needs.build-backend.result == 'success'
        || needs.changes.outputs.deploy_config == 'true'
      )
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}

            git pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Без применённых миграций новый код не поднимаем: он упадёт на старой схеме.
            sh migrate.sh || { echo "Миграции не применились, деплой остановлен"; exit 1; }

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
