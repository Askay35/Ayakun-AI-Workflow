name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NUXT_PUBLIC_API_BASE: /api/v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image names
        id: images
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.sha }}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ env.REGISTRY }}/${OWNER}/ayakun-backend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${OWNER}/ayakun-frontend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${{ env.REGISTRY }}/${OWNER}/ayakun-backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${{ env.REGISTRY }}/${OWNER}/ayakun-frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/app/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.images.outputs.backend_latest }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: runtime
          push: true
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ env.NUXT_PUBLIC_API_BASE }}
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.images.outputs.frontend_latest }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_PATH'"

          # Код на сервер; .env и TLS на сервере не трогаем
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/.nuxt' \
            --exclude 'frontend/.output' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'backend/app/.venv' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache' \
            --exclude 'README.md' \
            --exclude '.idea' \
            --exclude '.cursor' \
            --exclude 'docs' \
            --exclude '.vscode' \
            --exclude 'deploy/certs' \
            --exclude 'ssl' \
            --exclude 'agent-transcripts' \
            --exclude '.env.images' \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"

          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && \
            if [ ! -f .env ]; then \
              if [ -f .env.production ]; then \
                cp .env.production .env && echo '.env.production copied to .env'; \
              else \
                echo 'ERROR: .env not found on server. Create $SERVER_PATH/.env before deploy.' && exit 1; \
              fi; \
            else \
              echo 'Using existing .env on server'; \
            fi"

          COMPOSE='docker compose --env-file .env --env-file .env.images -f docker-compose.yml -f docker-compose.prod.yml'

          ssh "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_PATH' && \
            printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' '$BACKEND_IMAGE' '$FRONTEND_IMAGE' > .env.images && \
            echo \"Using BACKEND_IMAGE=$BACKEND_IMAGE\" && \
            echo \"Using FRONTEND_IMAGE=$FRONTEND_IMAGE\" && \
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
            $COMPOSE pull backend frontend && \
            echo 'Running migrations...' && \
            $COMPOSE --profile migrate run --rm migrate && \
            echo 'Starting services...' && \
            if ! $COMPOSE up -d --no-build --pull never; then \
              echo 'ERROR: compose up failed' && \
              $COMPOSE ps -a && \
              $COMPOSE logs --tail=150 backend frontend worker beat proxy && \
              exit 1; \
            fi && \
            echo 'Waiting for containers to become ready...' && \
            ready=0 && \
            for i in \$(seq 1 36); do \
              ok=1 && \
              for service in backend frontend worker beat proxy; do \
                if ! $COMPOSE ps --status running --services | grep -qx \"\$service\"; then \
                  ok=0 && break; \
                fi; \
              done && \
              if [ \"\$ok\" -eq 1 ]; then ready=1 && break; fi && \
              echo \"waiting (\$i/36)...\" && \
              sleep 5; \
            done && \
            $COMPOSE ps -a && \
            if [ \"\$ready\" -ne 1 ]; then \
              echo 'ERROR: core services did not become running in time' && \
              $COMPOSE logs --tail=150 backend frontend worker beat proxy && \
              exit 1; \
            fi && \
            echo 'Core services are up'"

      - name: Health check
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          echo "Waiting for proxy health..."
          sleep 10

          COMPOSE='docker compose --env-file .env --env-file .env.images -f docker-compose.yml -f docker-compose.prod.yml'

          echo "Container status:"
          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && $COMPOSE ps"

          check_url() {
            local url="$1"
            curl -ksS -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000"
          }

          HTTP_CODE="$(check_url "https://$SERVER_HOST/healthz")"
          if [ "$HTTP_CODE" != "200" ]; then
            HTTP_CODE="$(check_url "http://$SERVER_HOST/healthz")"
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed. /healthz status: $HTTP_CODE"
            ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && $COMPOSE logs --tail=80 backend frontend proxy"
            exit 1
          fi

          echo "Health check OK (/healthz -> $HTTP_CODE)"
          echo "Deployment successful!"
