name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_PATH'"

          # Код на сервер; .env и TLS на сервере не трогаем
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/.nuxt' \
            --exclude 'frontend/.output' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'backend/app/.venv' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache' \
            --exclude 'README.md' \
            --exclude '.idea' \
            --exclude '.cursor' \
            --exclude 'docs' \
            --exclude '.vscode' \
            --exclude 'deploy/certs' \
            --exclude 'ssl' \
            --exclude 'agent-transcripts' \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"

          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && \
            if [ ! -f .env ]; then \
              if [ -f .env.production ]; then \
                cp .env.production .env && echo '.env.production copied to .env'; \
              else \
                echo 'ERROR: .env not found on server. Create $SERVER_PATH/.env before deploy.' && exit 1; \
              fi; \
            else \
              echo 'Using existing .env on server'; \
            fi"

          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && \
            export IMAGE_TAG='$IMAGE_TAG' && \
            echo \"Building images with IMAGE_TAG=\$IMAGE_TAG\" && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend worker beat frontend && \
            echo 'Running migrations...' && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate && \
            echo 'Starting services...' && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d && \
            echo 'Waiting for containers...' && \
            sleep 30 && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps && \
            for service in backend frontend worker beat proxy; do \
              if ! docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --status running --services | grep -qx \"\$service\"; then \
                echo \"ERROR: service \$service is not running\" && \
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=120 \"\$service\" && \
                exit 1; \
              fi; \
            done && \
            echo 'Core services are up'"

      - name: Health check
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          echo "Waiting for proxy health..."
          sleep 10

          echo "Container status:"
          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && docker compose -f docker-compose.yml -f docker-compose.prod.yml ps"

          check_url() {
            local url="$1"
            curl -ksS -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000"
          }

          HTTP_CODE="$(check_url "https://$SERVER_HOST/healthz")"
          if [ "$HTTP_CODE" != "200" ]; then
            HTTP_CODE="$(check_url "http://$SERVER_HOST/healthz")"
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed. /healthz status: $HTTP_CODE"
            ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 backend frontend proxy"
            exit 1
          fi

          echo "Health check OK (/healthz -> $HTTP_CODE)"
          echo "Deployment successful!"
