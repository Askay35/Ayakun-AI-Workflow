[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "celery>=5.5.0",
    "clickhouse-connect>=1.8.0",
    "croniter>=6.0.0",
    "cryptography>=50.0.1",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "google-auth[requests]>=2.40.0",
    "httpx>=0.28.0",
    "openai>=3.11.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.52.4",
    "yookassa>=3.12.1",
