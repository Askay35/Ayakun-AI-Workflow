services:
  backend:
    image: ${PROD_BACKEND_IMAGE:-ghcr.io/askay35/ayakun-ai-workflow-backend:latest}
    environment:
      ENVIRONMENT: production
    command: ["uv", "run", "--no-sync", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports: !reset
      - "127.0.0.1:8000:8000"
    volumes: !reset []
    restart: unless-stopped

  worker:
    image: ${PROD_BACKEND_IMAGE:-ghcr.io/askay35/ayakun-ai-workflow-backend:latest}
    environment:
      ENVIRONMENT: production
    volumes: !reset []
    restart: unless-stopped

  beat:
    image: ${PROD_BACKEND_IMAGE:-ghcr.io/askay35/ayakun-ai-workflow-backend:latest}
    environment:
      ENVIRONMENT: production
    volumes: !reset
      - celery-beat-data:/var/lib/celery
    restart: unless-stopped

  migrate:
    image: ${PROD_BACKEND_IMAGE:-ghcr.io/askay35/ayakun-ai-workflow-backend:latest}
    environment:
      ENVIRONMENT: production
    volumes: !reset []

  frontend:
    image: ${PROD_FRONTEND_IMAGE:-ghcr.io/askay35/ayakun-ai-workflow-frontend:latest}
    build: !reset null
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
      HOST: 0.0.0.0
      PORT: 3000
    command: ["node", ".output/server/index.mjs"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes: !reset []
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  rabbitmq:
    ports: !reset []
    restart: unless-stopped

  loki:
    ports: !reset []
    restart: unless-stopped

  promtail:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}