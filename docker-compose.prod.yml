services:
  backend:
    image: ${PROD_BACKEND_IMAGE:-ayakun-backend:dev}
    environment:
      ENVIRONMENT: production
    command: ["uv", "run", "--no-sync", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports: !reset []
    volumes: !reset []
    restart: unless-stopped

  worker:
    image: ${PROD_BACKEND_IMAGE:-ayakun-backend:dev}
    environment:
      ENVIRONMENT: production
    volumes: !reset []
    restart: unless-stopped

  beat:
    image: ${PROD_BACKEND_IMAGE:-ayakun-backend:dev}
    environment:
      ENVIRONMENT: production
    volumes: !reset
      - celery-beat-data:/var/lib/celery
    restart: unless-stopped

  migrate:
    image: ${PROD_BACKEND_IMAGE:-ayakun-backend:dev}
    environment:
      ENVIRONMENT: production
    volumes: !reset []

  frontend:
    image: ${PROD_FRONTEND_IMAGE:-ghcr.io/askay35/ayakun-ai-workflow:latest}
    build: !reset null
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
      HOST: 0.0.0.0
      PORT: 3000
    command: ["node", ".output/server/index.mjs"]
    ports: !reset []
    volumes: !reset []
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  rabbitmq:
    ports: !reset []
    restart: unless-stopped

  loki:
    ports: !reset []
    restart: unless-stopped

  promtail:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:-./deploy/certs/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./deploy/certs/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    networks:
      - app
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped


