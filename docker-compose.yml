x-backend: &backend
  build:
    context: .
    dockerfile: backend/app/Dockerfile
  image: ayakun-backend:${IMAGE_TAG:-dev}
  env_file:
    - .env
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-development}
  dns:
    - 8.8.8.8
    - 1.1.1.1
  networks:
    - app

x-backend-dependencies: &backend-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  backend:
    <<: *backend
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app
    depends_on: *backend-dependencies
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    <<: *backend
    command: ["/bin/sh", "-c", "exec uv run --no-sync celery -A \"$${CELERY_APP}\" worker --loglevel=info"]
    volumes:
      - ./backend/app:/app
    depends_on: *backend-dependencies
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync celery -A \"$${CELERY_APP}\" inspect ping --destination \"celery@$${HOSTNAME}\" --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    command: ["/bin/sh", "-c", "exec uv run --no-sync celery -A \"$${CELERY_APP}\" beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule"]
    volumes:
      - ./backend/app:/app
      - celery-beat-data:/var/lib/celery
    depends_on: *backend-dependencies
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    <<: *backend
    profiles: ["migrate"]
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"
    volumes:
      - ./backend/app:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dependencies
    image: ayakun-frontend:${IMAGE_TAG:-dev}
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://backend:8000/api/v1}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
      HOST: 0.0.0.0
      PORT: 3000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-nuxt:/app/.nuxt
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-ayakun}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  loki:
    image: grafana/loki:3.4.2
    user: "0"
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ayakun-execution-logs.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app
    depends_on:
      loki:
        condition: service_healthy

volumes:
  celery-beat-data:
  frontend-node-modules:
  frontend-nuxt:
  postgres-data:
  redis-data:
  rabbitmq-data:
  loki-data:
  grafana-data:

networks:
  app:
    driver: bridge


