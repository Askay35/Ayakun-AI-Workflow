x-backend: &backend
  build:
    context: .
    dockerfile: backend/app/Dockerfile
  image: yakun-backend:${IMAGE_TAG:-dev}
  environment: &backend-environment
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DB_URL: ${DB_URL}
    REDIS_URL: ${REDIS_URL}
    SECRET_KEY: ${SECRET_KEY}
    TOKEN_EXPIRATION_TIME: ${TOKEN_EXPIRATION_TIME:-30}
    LOGIN_CODE_EXPIRATION_TIME: ${LOGIN_CODE_EXPIRATION_TIME:-10}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    QWEN_SEARCH_MODEL: ${QWEN_SEARCH_MODEL:-qwen-turbo}
    QWEN_SIMPLE_MODEL: ${QWEN_SIMPLE_MODEL:-qwen-turbo}
    QWEN_COMPLEX_MODEL: ${QWEN_COMPLEX_MODEL:-qwen-plus}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    DEEPSEEK_COMPLEX_MODEL: ${DEEPSEEK_COMPLEX_MODEL:-deepseek-v4-pro}
    DEEPSEEK_SIMPLE_MODEL: ${DEEPSEEK_SIMPLE_MODEL:-deepseek-flash}
    WEB_SEARCH_LLM_PROVIDER: ${WEB_SEARCH_LLM_PROVIDER:-serper}
    SIMPLE_LLM_PROVIDER: ${SIMPLE_LLM_PROVIDER:-deepseek}
    SIMPLE_LLM_MODEL: ${SIMPLE_LLM_MODEL:-deepseek-flash}
    COMPLEX_LLM_PROVIDER: ${COMPLEX_LLM_PROVIDER:-deepseek}
    COMPLEX_LLM_MODEL: ${COMPLEX_LLM_MODEL:-deepseek-v4-pro}
    ALLOWED_LLM_MODELS: ${ALLOWED_LLM_MODELS:-deepseek-v4-flash,deepseek-v4-pro,qwen-turbo,qwen-plus}
    YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
    YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
    YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:3000/billing}
    INITIAL_TOKEN_BALANCE: ${INITIAL_TOKEN_BALANCE:-3000}
    COST_PROMPT_SIMPLE: ${COST_PROMPT_SIMPLE:-100}
    COST_PROMPT_COMPLEX: ${COST_PROMPT_COMPLEX:-300}
    COST_WEB_SEARCH: ${COST_WEB_SEARCH:-150}
    COST_TELEGRAM_SEND: ${COST_TELEGRAM_SEND:-5}
    RESERVE_TOKENS_PER_NODE: ${RESERVE_TOKENS_PER_NODE:-100}
    LLM_TOKENS_PER_1000: ${LLM_TOKENS_PER_1000:-40}
    WEB_SEARCH_TOKENS: ${WEB_SEARCH_TOKENS:-150}
    TELEGRAM_SEND_TOKENS: ${TELEGRAM_SEND_TOKENS:-5}
    PAYMENT_TOKENS_PER_RUBLE: ${PAYMENT_TOKENS_PER_RUBLE:-100}
    CELERY_APP: ${CELERY_APP:-execution.celery_app:celery_app}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    SERPER_KEY: ${SERPER_KEY:-}
    LANGSEARCH_KEY: ${LANGSEARCH_KEY:-}
  networks:
    - app

x-backend-dependencies: &backend-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  backend:
    <<: *backend
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app
    depends_on: *backend-dependencies
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    <<: *backend
    command: ["/bin/sh", "-c", "exec uv run --no-sync celery -A \"$${CELERY_APP}\" worker --loglevel=info"]
    volumes:
      - ./backend/app:/app
    depends_on: *backend-dependencies
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync celery -A \"$${CELERY_APP}\" inspect ping --destination \"celery@$${HOSTNAME}\" --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    command: ["/bin/sh", "-c", "exec uv run --no-sync celery -A \"$${CELERY_APP}\" beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule"]
    volumes:
      - ./backend/app:/app
      - celery-beat-data:/var/lib/celery
    depends_on: *backend-dependencies
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    <<: *backend
    profiles: ["migrate"]
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"
    volumes:
      - ./backend/app:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dependencies
    image: yakun-frontend:${IMAGE_TAG:-dev}
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://backend:8000/api/v1}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
      HOST: 0.0.0.0
      PORT: 3000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-nuxt:/app/.nuxt
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-yakun}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  celery-beat-data:
  frontend-node-modules:
  frontend-nuxt:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  app:
    driver: bridge


